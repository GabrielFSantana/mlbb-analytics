services:
  postgres:
    image: postgres:16-alpine
    container_name: mlbb_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mlbb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-mlbb}
    ports:
      # Exposto no host para facilitar inspecao com psql/DBeaver em dev.
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mlbb} -d ${POSTGRES_DB:-mlbb}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: mlbb_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Sobrescreve o host do .env: dentro da rede do compose o banco e "postgres".
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-mlbb}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-mlbb}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    # Aplica as migrations antes de servir; idempotente a cada restart.
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request,sys;
          sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=5).status == 200 else 1)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  bot:
    build:
      context: .
      dockerfile: bot/Dockerfile
    container_name: mlbb_bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      BACKEND_API_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
