[project]
name = "mlbb-analytics"
version = "0.1.0"
description = "Plataforma de analise para Mobile Legends: Bang Bang"
requires-python = ">=3.12"

[tool.pytest.ini_options]
pythonpath = ["backend", "."]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.flake8-bugbear]
# Query/Depends/Path no default sao o idioma do FastAPI, nao o bug que B008 caca.
extend-immutable-calls = ["fastapi.Query", "fastapi.Depends", "fastapi.Path", "fastapi.Body"]

[tool.ruff.lint.isort]
# backend/ e bot/ sao codigo nosso, nao dependencia de terceiro.
known-first-party = ["app", "bot"]
